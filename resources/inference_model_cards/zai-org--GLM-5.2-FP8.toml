model_id = "zai-org/GLM-5.2-FP8"
n_layers = 78
hidden_size = 6144
num_key_value_heads = 64
supports_tensor = true
tasks = ["TextGeneration"]
family = "glm"
quantization = "fp8"
base_model = "GLM-5.2"
capabilities = ["text", "thinking"]
reasoning_dialect = "post_last_user"
context_length = 202752
backends = ["MlxMetal", "MlxCuda", "MlxCpu"]
[storage_size]
# On-disk download is 755617140416 bytes (fp8 e4m3, 128x128 block scales),
# but mlx-lm dequantizes fp8 weights to bf16 at load time and placement
# treats storage_size as the memory requirement, so use the bf16 footprint.
in_bytes = 1506659919872

# Source: https://huggingface.co/zai-org/GLM-5.2-FP8
# Source: https://docs.z.ai/api-reference/llm/chat-completion
[sampling_defaults]
temperature = 1.0
top_p = 0.95
